version: '3.8'

services:
  app:
    image: taskmaster_pro_app
    build: .
    ports:
      - "80:80"
    environment:
      - ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/taskmaster
    depends_on:
      - db

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: taskmaster
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    driver: local